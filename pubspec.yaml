name: wayoadsgo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+13

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  country_flags: ^3.2.0
  # cupertino_icons removed — unused (Material-only app)
  flutter_animate: ^4.5.2
  google_sign_in: ^6.3.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  go_router: ^14.0.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  slang: 4.4.0
  slang_flutter: 4.4.0
  riverpod_annotation: ^2.3.5
  crypto: ^3.0.7
  dio_smart_retry: 7.0.1
  sentry_flutter: ^9.0.0
  sentry_dio: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  equatable: ^2.0.7
  # mutex removed — unused
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.3
  # shimmer removed — unused (using skeletonizer instead)
  # animations removed — unused
  flutter_staggered_animations: ^1.1.1
  # SECURITY: Pinned to exact version (0.0.x is immature — audit before upgrading)
  pusher_reverb_flutter: 0.0.4
  intl: ^0.20.2
  # sensors_plus removed — unused (NSMotionUsageDescription also removed from iOS)
  dart_pusher_channels: ^1.2.3
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  connectivity_plus: ^7.1.1
  flutter_stripe: ^11.5.0
  tutorial_coach_mark: ^1.3.3
  flutter_svg: ^2.0.10
  sign_in_with_apple: ^6.1.4
  flutter_native_splash: ^2.4.3
  # Invoices feature: PDF download, temp storage, OS share / open.
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # NOTE: dart_defines.json is NOT bundled — secrets must come from
    # --dart-define or --dart-define-from-file at compile time only.
    # This prevents extracting API keys from the APK/IPA.
    - assets/splash/wayo_dot_icon.png
    - assets/images/wayo_ads_logo.png
    - assets/branding/google_g_logo.svg
    - assets/branding/wayo_splash_p1.svg
    - assets/branding/wayo_splash_p2.svg
    - assets/branding/wayo_splash_p3.svg

# Branding is 100% the animated [SplashScreen] (see lib/features/splash/splash_screen.dart).
# Do NOT call FlutterNativeSplash.preserve in main.dart — it defers the first Flutter frame
# and prolongs the OS launch screen ("black splash").
# After `dart run flutter_native_splash:create`, restore these manual tweaks:
#  - iOS: LaunchScreen.storyboard root view backgroundColor → black (generator resets to white).
#  - Android 12+ (values-v31 + values-night-v31 styles.xml):
#      * LaunchTheme parent stays Theme.SplashScreen.
#      * Add android:windowSplashScreenAnimatedIcon=@drawable/splash_empty_icon (else OS shows
#        the launcher adaptive icon — the "W" — as a static splash logo).
flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  fullscreen: true
  android_12:
    color: "#000000"
    icon_background_color: "#000000"
    color_dark: "#000000"
    icon_background_color_dark: "#000000"
  android: true
  ios: true
  web: false

# App launcher icons (home screen). After changing sources, run:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: '#000000'
  image_path_android: assets/android-chrome-192x192.png
  image_path_ios: assets/apple-touch-icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/android-chrome-192x192.png

name: wayoadsgo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  country_flags: ^3.2.0
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_appauth: ^9.0.0
  google_sign_in: ^6.3.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  go_router: ^14.0.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  slang: 4.4.0
  slang_flutter: 4.4.0
  riverpod_annotation: ^2.3.5
  crypto: ^3.0.7
  dio_smart_retry: 7.0.1
  sentry_flutter: 8.12.0
  sentry_dio: 8.12.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  equatable: ^2.0.7
  mutex: ^3.1.0
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.3
  shimmer: ^3.0.0
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1
  pusher_reverb_flutter: ^0.0.4
  intl: ^0.20.2
  sensors_plus: ^6.1.1
  dart_pusher_channels: ^1.2.3
  file_picker: ^11.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - dart_defines.json
    - assets/splash/wayo_dot.png
  shaders:
    - shaders/liquid_metal.frag

flutter_native_splash:
  color: "#0A0A0A"
  color_dark: "#0A0A0A"
  image: assets/splash/wayo_dot.png
  android_12:
    image: assets/splash/wayo_dot.png
    color: "#0A0A0A"
    icon_background_color: "#0A0A0A"
  android: true
  ios: true
